services:
  backend:
    image: zimengxiong/excalidash-backend:__VERSION__
    container_name: excalidash-backend
    init: true
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=local
      - FRONTEND_URL=https://__HOSTNAME__
      - TRUST_PROXY=2
      - BACKUP_SCHEDULE=0 0 4 * * *
      - BACKUP_DIR=/app/backups
      - BACKUP_RETENTION_DAYS=14
      - UPDATE_CHECK_OUTBOUND=false
    env_file:
      - /opt/excalidash/secrets.env
    volumes:
      - /opt/excalidash/data/prisma:/app/prisma
      - /opt/excalidash/data/backups:/app/backups
    networks:
      - excalidash
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: zimengxiong/excalidash-frontend:__VERSION__
    container_name: excalidash-frontend
    depends_on:
      - backend
    networks:
      - excalidash
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: excalidash-caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    volumes:
      - /opt/excalidash/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/excalidash/caddy/data:/data
      - /opt/excalidash/caddy/config:/config
    networks:
      - excalidash
    restart: unless-stopped

networks:
  excalidash:
    driver: bridge
